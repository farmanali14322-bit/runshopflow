    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5B1F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5B1F" stop-opacity="0"/>
